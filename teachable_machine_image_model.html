<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachable Machine Image Model</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2937;
      background: #f8fafc;
    }
    main {
      padding: 28px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      color: white;
      background: #2563eb;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #webcam-container { margin-top: 20px; }
    #webcam-container canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }
    #label-container { margin-top: 16px; display: grid; gap: 8px; }
    .prediction {
      padding: 10px 12px;
      background: #f1f5f9;
      border-radius: 8px;
    }
    #status { color: #64748b; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Teachable Machine Image Model</h1>
    <p>Tekan tombol Mulai untuk mengaktifkan kamera dan menjalankan prediksi gambar.</p>
    <button id="start-button" type="button" onclick="init()">Mulai</button>
    <div id="status" role="status">Model belum dimulai.</div>
    <div id="webcam-container"></div>
    <div id="label-container" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    // URL model yang diekspor dari Teachable Machine
    const URL = "https://teachablemachine.withgoogle.com/models/T2waq3b94/";

    let model, webcam, labelContainer, maxPredictions;
    let isRunning = false;

    async function init() {
      if (isRunning) return;

      const button = document.getElementById("start-button");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Memuat model...";

      try {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip);
        await webcam.setup();
        await webcam.play();

        document.getElementById("webcam-container").replaceChildren(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.replaceChildren();
        for (let i = 0; i < maxPredictions; i++) {
          const item = document.createElement("div");
          item.className = "prediction";
          labelContainer.appendChild(item);
        }

        isRunning = true;
        status.textContent = "Kamera aktif — prediksi berjalan.";
        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        status.textContent = "Gagal memulai. Izinkan akses kamera dan buka halaman melalui localhost atau HTTPS.";
        button.disabled = false;
      }
    }

    async function loop() {
      if (!isRunning) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const classPrediction =
          prediction[i].className + ": " +
          (prediction[i].probability * 100).toFixed(1) + "%";
        labelContainer.children[i].textContent = classPrediction;
      }
    }
  </script>
</body>
</html>
